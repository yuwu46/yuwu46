<svg xmlns="http://www.w3.org/2000/svg" width="960" height="226" viewBox="0 0 960 226" role="img" aria-labelledby="title desc">
  <title id="title">Distribution of public pull request commits by repository</title>
  <desc id="desc">Of 149 commits in public pull requests, 132 or 88.6 percent are in PFCCLab PaddleAPITest, 11 or 7.4 percent are in PaddlePaddle Paddle, and 6 or 4.0 percent are in PaddlePaddle docs.</desc>
  <style>
    .title { fill: #0f172a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .center-label { fill: #64748b; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .center-value { fill: #0f172a; font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .rule { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .title, .value, .center-value { fill: #e6edf3; }
      .label, .center-label { fill: #8b949e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <circle cx="190" cy="125" r="70" fill="none" stroke="#e2e8f0" stroke-width="28" />
  <g transform="rotate(-90 190 125)">
    <circle cx="190" cy="125" r="70" fill="none" stroke="#1d4ed8" stroke-width="28" stroke-dasharray="390.1 49.7" />
    <circle cx="190" cy="125" r="70" fill="none" stroke="#0891b2" stroke-width="28" stroke-dasharray="32.5 407.3" stroke-dashoffset="-390.1" />
    <circle cx="190" cy="125" r="70" fill="none" stroke="#0f766e" stroke-width="28" stroke-dasharray="17.7 422.1" stroke-dashoffset="-422.6" />
  </g>
  <text class="center-label" x="190" y="105" text-anchor="middle">Public PR</text>
  <text class="center-label" x="190" y="123" text-anchor="middle">commits</text>
  <text class="center-value" x="190" y="158" text-anchor="middle">149</text>
  <circle cx="430" cy="78" r="7" fill="#1d4ed8" />
  <text class="label" x="450" y="83">PFCCLab / PaddleAPITest</text>
  <text class="value" x="896" y="83" text-anchor="end">132 · 88.6%</text>
  <line class="rule" x1="430" y1="103" x2="896" y2="103" />
  <circle cx="430" cy="129" r="7" fill="#0891b2" />
  <text class="label" x="450" y="134">PaddlePaddle / Paddle</text>
  <text class="value" x="896" y="134" text-anchor="end">11 · 7.4%</text>
  <line class="rule" x1="430" y1="154" x2="896" y2="154" />
  <circle cx="430" cy="180" r="7" fill="#0f766e" />
  <text class="label" x="450" y="185">PaddlePaddle / docs</text>
  <text class="value" x="896" y="185" text-anchor="end">6 · 4.0%</text>
</svg>
