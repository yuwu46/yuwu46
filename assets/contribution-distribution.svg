<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Distribution of public pull request commits by repository</title>
  <desc id="desc">Of 149 commits in public pull requests, 132 or 88.6 percent are in PFCCLab PaddleAPITest, 11 or 7.4 percent are in PaddlePaddle Paddle, and 6 or 4.0 percent are in PaddlePaddle docs.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".82" />
      <stop offset="1" stop-color="#dbeafe" stop-opacity=".36" />
    </linearGradient>
  </defs>
  <style>
    .surface { fill: url(#glass); stroke: #cbd5e1; stroke-width: 1; }
    .title { fill: #0f172a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle, .label { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .center-label { fill: #64748b; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .center-value { fill: #0f172a; font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .rule { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #161b22; fill-opacity: .88; stroke: #30363d; }
      .title, .value, .center-value { fill: #e6edf3; }
      .subtitle, .label, .center-label { fill: #8b949e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <rect class="surface" x="14" y="14" width="932" height="212" rx="16" />
  <text class="title" x="42" y="50">Public PR commits by repository</text>
  <circle cx="202" cy="139" r="70" fill="none" stroke="#e2e8f0" stroke-width="28" />
  <g transform="rotate(-90 202 139)">
    <circle cx="202" cy="139" r="70" fill="none" stroke="#1d4ed8" stroke-width="28" stroke-dasharray="390.1 49.7" />
    <circle cx="202" cy="139" r="70" fill="none" stroke="#0891b2" stroke-width="28" stroke-dasharray="32.5 407.3" stroke-dashoffset="-390.1" />
    <circle cx="202" cy="139" r="70" fill="none" stroke="#0f766e" stroke-width="28" stroke-dasharray="17.7 422.1" stroke-dashoffset="-422.6" />
  </g>
  <text class="center-label" x="202" y="130" text-anchor="middle">PR commits</text>
  <text class="center-value" x="202" y="165" text-anchor="middle">149</text>
  <circle cx="438" cy="92" r="7" fill="#1d4ed8" />
  <text class="label" x="458" y="97">PFCCLab / PaddleAPITest</text>
  <text class="value" x="872" y="97" text-anchor="end">132 commits · 88.6%</text>
  <line class="rule" x1="438" y1="117" x2="872" y2="117" />
  <circle cx="438" cy="141" r="7" fill="#0891b2" />
  <text class="label" x="458" y="146">PaddlePaddle / Paddle</text>
  <text class="value" x="872" y="146" text-anchor="end">11 commits · 7.4%</text>
  <line class="rule" x1="438" y1="166" x2="872" y2="166" />
  <circle cx="438" cy="190" r="7" fill="#0f766e" />
  <text class="label" x="458" y="195">PaddlePaddle / docs</text>
  <text class="value" x="872" y="195" text-anchor="end">6 commits · 4.0%</text>
</svg>
