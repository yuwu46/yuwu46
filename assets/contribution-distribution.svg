<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Distribution of public pull request commits by repository</title>
  <desc id="desc">Of 149 commits in public pull requests, 132 or 88.6 percent are in PFCCLab PaddleAPITest, 11 or 7.4 percent are in PaddlePaddle Paddle, and 6 or 4.0 percent are in PaddlePaddle docs.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".82" />
      <stop offset="1" stop-color="#dbeafe" stop-opacity=".36" />
    </linearGradient>
  </defs>
  <style>
    .surface { fill: url(#glass); stroke: #cbd5e1; stroke-width: 1; }
    .title { fill: #0f172a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle, .label { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .center-label { fill: #64748b; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .center-value { fill: #0f172a; font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .rule { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #161b22; fill-opacity: .88; stroke: #30363d; }
      .title, .value, .center-value { fill: #e6edf3; }
      .subtitle, .label, .center-label { fill: #8b949e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <rect class="surface" x="14" y="14" width="932" height="252" rx="16" />
  <text class="title" x="42" y="50">Public PR commits by repository</text>
  <text class="subtitle" x="42" y="74">Cumulative distribution · n = 149 commits</text>
  <circle cx="218" cy="158" r="77" fill="none" stroke="#e2e8f0" stroke-width="30" />
  <g transform="rotate(-90 218 158)">
    <circle cx="218" cy="158" r="77" fill="none" stroke="#1d4ed8" stroke-width="30" stroke-dasharray="428.9 54.9" />
    <circle cx="218" cy="158" r="77" fill="none" stroke="#0891b2" stroke-width="30" stroke-dasharray="35.8 448.0" stroke-dashoffset="-428.9" />
    <circle cx="218" cy="158" r="77" fill="none" stroke="#0f766e" stroke-width="30" stroke-dasharray="19.5 464.3" stroke-dashoffset="-464.7" />
  </g>
  <text class="center-label" x="218" y="149" text-anchor="middle">PR commits</text>
  <text class="center-value" x="218" y="184" text-anchor="middle">149</text>
  <circle cx="396" cy="111" r="7" fill="#1d4ed8" />
  <text class="label" x="416" y="116">PFCCLab / PaddleAPITest</text>
  <text class="value" x="860" y="116" text-anchor="end">132 commits · 88.6%</text>
  <line class="rule" x1="396" y1="136" x2="860" y2="136" />
  <circle cx="396" cy="164" r="7" fill="#0891b2" />
  <text class="label" x="416" y="169">PaddlePaddle / Paddle</text>
  <text class="value" x="860" y="169" text-anchor="end">11 commits · 7.4%</text>
  <line class="rule" x1="396" y1="189" x2="860" y2="189" />
  <circle cx="396" cy="217" r="7" fill="#0f766e" />
  <text class="label" x="416" y="222">PaddlePaddle / docs</text>
  <text class="value" x="860" y="222" text-anchor="end">6 commits · 4.0%</text>
</svg>
