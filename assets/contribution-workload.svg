<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Public pull request commits by repository</title>
  <desc id="desc">A horizontal bar chart of 149 commits in public pull requests: 132 in PFCCLab PaddleAPITest, 11 in PaddlePaddle Paddle, and 6 in PaddlePaddle docs.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #64748b; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #334155; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { fill: #94a3b8; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .title, .value { fill: #e6edf3; }
      .subtitle, .axis { fill: #8b949e; }
      .label { fill: #c9d1d9; }
      .grid { stroke: #30363d; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="260" rx="12" />
  <text class="title" x="38" y="42">Public PR commits by repository</text>
  <text class="subtitle" x="38" y="66">Cumulative record · n = 149 commits across 45 public PRs</text>
  <line class="grid" x1="320" y1="86" x2="320" y2="218" />
  <line class="grid" x1="455" y1="86" x2="455" y2="218" />
  <line class="grid" x1="590" y1="86" x2="590" y2="218" />
  <line class="grid" x1="725" y1="86" x2="725" y2="218" />
  <line class="grid" x1="860" y1="86" x2="860" y2="218" />
  <text class="axis" x="316" y="236">0</text>
  <text class="axis" x="441" y="236">33</text>
  <text class="axis" x="576" y="236">66</text>
  <text class="axis" x="707" y="236">99</text>
  <text class="axis" x="838" y="236">132</text>
  <text class="label" x="38" y="112">PFCCLab / PaddleAPITest</text>
  <rect x="320" y="94" width="540" height="26" rx="4" fill="#1d4ed8" />
  <text class="value" x="872" y="113">132</text>
  <text class="label" x="38" y="158">PaddlePaddle / Paddle</text>
  <rect x="320" y="140" width="45" height="26" rx="4" fill="#0891b2" />
  <text class="value" x="377" y="159">11</text>
  <text class="label" x="38" y="204">PaddlePaddle / docs</text>
  <rect x="320" y="186" width="25" height="26" rx="4" fill="#0f766e" />
  <text class="value" x="357" y="205">6</text>
</svg>
