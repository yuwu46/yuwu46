<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Merged public pull requests by repository</title>
  <desc id="desc">A horizontal bar chart of 44 merged public pull requests: 41 in PFCCLab PaddleAPITest, 2 in PaddlePaddle Paddle, and 1 in PaddlePaddle docs.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #64748b; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #334155; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { fill: #94a3b8; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .title, .value { fill: #e6edf3; }
      .subtitle, .axis { fill: #8b949e; }
      .label { fill: #c9d1d9; }
      .grid { stroke: #30363d; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="260" rx="12" />
  <text class="title" x="38" y="42">Merged public PRs by repository</text>
  <text class="subtitle" x="38" y="66">Cumulative record · n = 44 merged PRs</text>
  <line class="grid" x1="320" y1="86" x2="320" y2="218" />
  <line class="grid" x1="455" y1="86" x2="455" y2="218" />
  <line class="grid" x1="590" y1="86" x2="590" y2="218" />
  <line class="grid" x1="725" y1="86" x2="725" y2="218" />
  <line class="grid" x1="860" y1="86" x2="860" y2="218" />
  <text class="axis" x="316" y="236">0</text>
  <text class="axis" x="446" y="236">10</text>
  <text class="axis" x="581" y="236">20</text>
  <text class="axis" x="716" y="236">30</text>
  <text class="axis" x="851" y="236">40</text>
  <text class="label" x="38" y="112">PFCCLab / PaddleAPITest</text>
  <rect x="320" y="94" width="540" height="26" rx="4" fill="#1d4ed8" />
