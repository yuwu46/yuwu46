<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Cumulative public contribution summary</title>
  <desc id="desc">201 public commits, 149 commits in public pull requests, 45 public pull requests, and 44 merged public pull requests.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #0f172a; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #64748b; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 600 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .rule { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .title, .value { fill: #e6edf3; }
      .label { fill: #8b949e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="180" rx="16" />
  <text class="title" x="38" y="42">Cumulative public contribution record</text>
  <line class="rule" x1="240" y1="68" x2="240" y2="150" />
  <line class="rule" x1="480" y1="68" x2="480" y2="150" />
  <line class="rule" x1="720" y1="68" x2="720" y2="150" />
  <text class="label" x="38" y="91">Public commits</text>
  <text class="value" x="38" y="132">201</text>
  <text class="label" x="278" y="91">Commits in public PRs</text>
  <text class="value" x="278" y="132">149</text>
  <text class="label" x="518" y="91">Public PRs</text>
  <text class="value" x="518" y="132">45</text>
  <text class="label" x="758" y="91">Merged public PRs</text>
  <text class="value" x="758" y="132">44</text>
</svg>
